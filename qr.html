<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a07">
<title>Pharaoh's Bites</title>
<meta name="description" content="Pharaoh's Bites: Egyptian feteer and home cooking in Dallas. Order online or follow us on Instagram.">
<link rel="icon" href="assets/img/brand/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">
<style>
  :root{
    --bg:#0d0a07; --panel:#17110b; --gold:#d9a74a; --gold-2:#f3d48a; --gold-dim:rgba(217,167,74,.35);
    --text:#f5ead6; --muted:#bfae8f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--bg);color:var(--text)}
  body{
    font-family:"Jost",system-ui,sans-serif;font-weight:300;
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:32px 16px calc(32px + env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse 80% 55% at 50% 0%,rgba(217,167,74,.18),transparent 70%),
      radial-gradient(ellipse 70% 45% at 50% 100%,rgba(140,60,20,.22),transparent 70%),
      var(--bg);
  }
  .card{
    width:100%;max-width:420px;text-align:center;
    padding:36px 22px 26px;border-radius:22px;
    background:linear-gradient(180deg,rgba(23,17,11,.92),rgba(13,10,7,.92));
    border:1px solid var(--gold-dim);
    box-shadow:0 0 0 6px rgba(217,167,74,.05),0 24px 60px rgba(0,0,0,.55);
    animation:rise .6s ease-out both;
  }
  .logo{width:96px;height:96px;object-fit:contain;margin:0 auto 14px;display:block;filter:drop-shadow(0 4px 14px rgba(217,167,74,.35))}
  h1{
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:2.1rem;letter-spacing:.06em;line-height:1.05;color:var(--gold-2);
    text-shadow:0 0 18px rgba(217,167,74,.35);
  }
  .tag{margin-top:8px;font-size:.95rem;color:var(--muted);letter-spacing:.04em}
  .rule{display:flex;align-items:center;gap:10px;margin:22px 0 20px;color:var(--gold)}
  .rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
  .links{display:grid;gap:14px}
  .btn{
    display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 18px;
    border-radius:14px;text-decoration:none;text-align:left;
    font-size:1.08rem;font-weight:500;letter-spacing:.02em;
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.98)}
  .btn svg{width:28px;height:28px;flex:none}
  .btn small{display:block;font-size:.8rem;font-weight:300;opacity:.85;margin-top:2px}
  .btn .go{margin-left:auto;font-size:1.3rem;opacity:.8}
  .btn--site{
    color:#1b1206;
    background:linear-gradient(135deg,#f3d48a,#d9a74a 55%,#b9832c);
    box-shadow:0 8px 24px rgba(217,167,74,.3);
  }
  .btn--ig{
    color:#fff;
    background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#8134af);
    box-shadow:0 8px 24px rgba(221,42,123,.25);
  }
  @media (hover:hover){.btn:hover{transform:translateY(-2px)}}
  .btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
  .foot{margin-top:22px;font-size:.82rem;color:var(--muted);line-height:1.6}
  .foot a{color:var(--gold-2);text-decoration:none}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}.btn{transition:none}}
  @media (max-width:340px){h1{font-size:1.8rem}.btn{font-size:1rem;gap:10px;padding:12px 14px}}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/img/brand/mark.png" alt="Pharaoh's Bites logo" width="96" height="96">
    <h1>PHARAOH'S BITES</h1>
    <p class="tag">The Art of Feteer · Dallas-Fort Worth</p>
    <div class="rule" aria-hidden="true">&#9765;</div>

    <nav class="links" aria-label="Choose where to go">
      <a class="btn btn--site" href="order.html?src=qr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
        <span>Menu &amp; Order Online<small>pharaohsbites.com</small></span>
        <span class="go" aria-hidden="true">&rsaquo;</span>
      </a>
      <a class="btn btn--ig" href="https://www.instagram.com/pharaohs.bites/" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span>Follow on Instagram<small>@pharaohs.bites</small></span>
        <span class="go" aria-hidden="true">&rsaquo;</span>
      </a>
    </nav>

    <p class="foot">Free delivery on your first order within 10 miles<br>with code <a href="order.html?src=qr">FIRSTBITE</a></p>
  </main>
</body>
</html>
